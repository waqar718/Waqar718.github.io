<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>جامعہ اسلامیہ قادریہ وہاڑی</title>
    <style>
        body { font-family: 'Noto Nastaliq Urdu', serif; margin: 0; padding: 0; background-color: #f9f9f9; color: #333; }
        header { background-color: #0d4133; color: white; padding: 30px 20px; text-align: center; border-bottom: 5px solid #c5a059; }
        header img { max-width: 150px; height: auto; margin-bottom: 15px; }
        header h1 { margin: 0; font-size: 2.5rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        nav { background: #135d47; color: white; text-align: center; padding: 15px; position: sticky; top: 0; }
        nav a { color: white; margin: 0 20px; text-decoration: none; font-weight: bold; font-size: 1.1rem; }
        nav a:hover { color: #c5a059; }
        .hero { background: #ffffff; padding: 60px 20px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin: 20px; border-radius: 8px; }
        .hero h2 { color: #0d4133; font-size: 2rem; margin-bottom: 15px; }
        .hero p { font-size: 1.2rem; line-height: 1.6; color: #555; max-width: 800px; margin: 0 auto; }
        footer { background-color: #0d4133; color: white; text-align: center; padding: 20px; margin-top: 40px; font-size: 0.9rem; }
    </style>
</head>
<body>

<header>
    <img src="https://raw.githubusercontent.com/waqar718/waqar718.github.io/main/1794673918695.png" alt="جامعہ اسلامیہ قادریہ لوگو">
    <h1>جامعہ اسلامیہ قادریہ وہاڑی</h1>
</header>

<nav>
    <a href="#">صفحہ اول</a>
    <a href="#">تعارف</a>
    <a href="#">شعبہ جات</a>
    <a href="#">رابطہ</a>
</nav>

<div class="hero">
    <h2>خوش آمدید</h2>
    <p>دینِ اسلام کی نشر و اشاعت اور علومِ نبوی کی ترویج کا ایک عظیم مرکز۔</p>
</div>

<footer>
    <p>جملہ حقوق محفوظ © 2026 جامعہ اسلامیہ قادریہ وہاڑی</p>
</footer>

</body>
</html>
